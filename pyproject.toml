[project]
name = "interruptible-agent"
version = "0.1.0"
description = "Full-duplex interruptible real-time agent system"
readme = "interruptible-agents-build-plan(1).md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pydantic>=2.0",
    "jsonschema>=4.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-dotenv>=1.0",
    "numpy>=1.24",
    "faster-whisper>=1.0",
    "av>=11.0",
    "onnxruntime>=1.17",
]

[project.optional-dependencies]
# Tier-1 semantic intent classification (§7.2); falls back to keyword heuristics if absent.
embeddings = ["sentence-transformers>=2.5"]
# Local/offline LLM serving tooling for the LocalQwenBackend's own server process.
local = ["vllm>=0.4", "transformers>=4.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = [
    "live: hits a real network-dependent LLM/API provider; excluded by default, run with `pytest -m live`.",
]
