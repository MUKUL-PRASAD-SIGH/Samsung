name: Nightly live eval

# Real LLM, real quota: runs the dev + hold-out suites 3 times each and publishes the report. Needs the repository
# secret GROQ_API_KEY. Groq's free tier allows ~200k tokens/day and one 3-run pass over all scenarios costs about that,
# so this is scheduled once a day and can also be started by hand with fewer runs.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      runs:
        description: "Repetitions per scenario"
        default: "3"

jobs:
  live-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: pyproject.toml }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: hf-models-whisper-base-en-v1 }
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev,embeddings]"
      - name: Live eval
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p eval_results
          python -m agent.eval --llm live --set all --runs ${{ github.event.inputs.runs || '3' }} \
            --out eval_results/live_$(date -u +%F).json | tee eval_results/live_$(date -u +%F).txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-eval-report
          path: eval_results/
