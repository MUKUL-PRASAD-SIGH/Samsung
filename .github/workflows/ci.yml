name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ruff
      - run: ruff check agent tests scripts      # correctness rules only (see pyproject.toml): undefined names, unused imports...

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]       # pyproject: requires-python >=3.10,<3.13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System packages (ffmpeg decodes the push-to-talk WebM path and the voice fixtures)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Cache models (Whisper base.en, Silero)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-whisper-base-en-v1
      # CPU-only torch + sentence-transformers so the MiniLM interrupt classifier runs exactly as it does in production.
      - name: Install
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev,embeddings]"
      - name: Unit + integration tests (live tests excluded by pyproject)
        run: pytest -q -p no:cacheprovider
      - name: Mock-mode eval gate (dev + hold-out, virtual clock)
        # Every scenario >= 95, overall >= 97, and zero stale completions / duplicate state changes / invalid payloads /
        # trace violations / false completion claims. Voice scenarios are skipped in virtual time (they need real audio).
        run: python -m agent.eval --llm mock --virtual --set all --quiet --fail-under 97 --min-scenario 95

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit + Robolectric UI tests, then the debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (models are downloaded at first run, not baked, to keep CI fast)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: BAKE_MODELS=0
          cache-from: type=gha
          cache-to: type=gha,mode=max
