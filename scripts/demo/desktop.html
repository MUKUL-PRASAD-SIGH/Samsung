<!doctype html>
<html><head><meta charset="utf-8"><title>Desktop</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000;font-family:"Cantarell","Inter",ui-sans-serif,system-ui,sans-serif;color:#e5e7eb;user-select:none}
#screen{position:absolute;inset:0;overflow:hidden}
#wall{position:absolute;inset:0;background:
 radial-gradient(1200px 700px at 72% 18%,rgba(212,160,23,.22),transparent 60%),
 radial-gradient(900px 700px at 12% 90%,rgba(56,189,248,.18),transparent 60%),
 linear-gradient(160deg,#1b2440 0%,#0f1426 55%,#0a0d18 100%)}
#wall svg{position:absolute;right:120px;bottom:-40px;opacity:.10}
#panel{position:absolute;left:0;top:0;right:0;height:32px;background:rgba(8,10,18,.92);display:flex;align-items:center;padding:0 14px;font-size:14px;font-weight:600;z-index:50;justify-content:space-between}
#panel .l,#panel .r{display:flex;gap:16px;align-items:center;flex:1}#panel .r{justify-content:flex-end;color:#cbd5e1}
#panel .c{flex:0 0 auto;font-weight:700}
#panel .app{color:#fff;opacity:.0;transition:opacity .4s}#panel .app.on{opacity:1}
#icons{position:absolute;left:34px;top:70px;display:flex;flex-direction:column;gap:26px}
.ico{width:104px;text-align:center;font-size:14px;text-shadow:0 1px 3px #000;padding:8px 4px;border-radius:10px;border:1px solid transparent}
.ico .g{width:64px;height:64px;margin:0 auto 6px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:34px}
.ico.sel{background:rgba(212,160,23,.22);border-color:rgba(212,160,23,.55)}
.ico img{width:64px;height:64px;border-radius:16px;box-shadow:0 6px 16px rgba(0,0,0,.5)}
#dock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:14px;padding:10px 16px;border-radius:22px;background:rgba(15,20,36,.72);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(10px);z-index:40;transition:transform .5s,opacity .5s}
#dock.hide{transform:translate(-50%,140px);opacity:0}
#dock .d{width:58px;height:58px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;position:relative}
#dock .d img{width:58px;height:58px;border-radius:14px}
#dock .d.run::after{content:"";position:absolute;bottom:-8px;left:50%;margin-left:-3px;width:6px;height:6px;border-radius:50%;background:#fbbf24}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-26px)}60%{transform:translateY(0)}80%{transform:translateY(-10px)}}
.bounce{animation:bounce 1.1s ease-out}
.win{position:absolute;border-radius:12px;overflow:hidden;background:#0b0e14;box-shadow:0 30px 90px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.1);opacity:0;pointer-events:none;
 transition:left .65s cubic-bezier(.22,.8,.28,1),top .65s cubic-bezier(.22,.8,.28,1),width .65s cubic-bezier(.22,.8,.28,1),height .65s cubic-bezier(.22,.8,.28,1),opacity .35s,transform .45s cubic-bezier(.22,.8,.28,1),border-radius .65s}
.win.on{opacity:1;transform:none;pointer-events:auto}
.win.pre{transform:scale(.86) translateY(40px)}
.tb{height:36px;background:#141824;display:flex;align-items:center;padding:0 12px;gap:10px;font-size:14px;font-weight:600;color:#cbd5e1;justify-content:space-between}
.tb .ctl{display:flex;gap:8px}.tb .ctl i{width:14px;height:14px;border-radius:50%;background:#475569;display:block}.tb .ctl i:last-child{background:#f43f5e}
#kw{left:560px;top:150px;width:800px;height:560px;z-index:20}
#kw.max{left:0;top:32px;width:1920px;height:1048px;border-radius:0}
#kw iframe{position:absolute;left:0;top:36px;width:100%;height:calc(100% - 36px);border:0;background:#0b0e14;opacity:0;transition:opacity .5s}
#kw iframe.on{opacity:1}
#kw .splash{position:absolute;left:0;top:36px;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(600px 340px at 50% 40%,#2a2210,#0b0e14 70%);transition:opacity .5s}
#kw .splash.off{opacity:0}
#kw .splash img{width:96px;height:96px}
#kw .splash b{font:600 40px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.3em;color:#fbbf24}
@keyframes spin{to{transform:rotate(360deg)}}
#kw .splash .sp{width:26px;height:26px;border-radius:50%;border:3px solid rgba(251,191,36,.25);border-top-color:#fbbf24;animation:spin .8s linear infinite}
/* ---------- editor (VS Code lookalike) ---------- */
#cw{left:120px;top:70px;width:1680px;height:940px;z-index:30;background:#1e1e1e;font-family:Inter,system-ui,sans-serif}
#cw.big{}
#cw .tb{background:#323233;height:34px;color:#ccc;font-weight:500;justify-content:center;position:relative}
#cw .tb .ctl{position:absolute;left:12px}
#cw .body{display:flex;height:calc(100% - 34px - 24px)}
#cw .act{width:52px;background:#333;display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:14px;font-size:22px;color:#858585}
#cw .act .a1{color:#fff}
#cw .side{width:260px;background:#252526;font-size:13px;color:#ccc;padding:10px 0}
#cw .side h6{margin:0 0 8px;padding:0 16px;font:600 11px Inter,sans-serif;letter-spacing:.08em;color:#bbb}
#cw .side .dir{padding:3px 16px;font-weight:700;font-size:12px;color:#ddd}
#cw .side .f{padding:3px 16px 3px 34px;display:flex;gap:6px;align-items:center}
#cw .side .f.act2{background:#37373d;color:#fff}
#cw .main{flex:1;display:flex;flex-direction:column;min-width:0}
#cw .tabs{height:36px;background:#252526;display:flex}
#cw .tab{padding:0 18px;display:flex;align-items:center;gap:8px;background:#1e1e1e;color:#fff;font-size:13px;border-top:1px solid #fbbf24}
#cw .crumbs{height:24px;font-size:12px;color:#a0a0a0;padding:3px 16px;background:#1e1e1e}
#cw .code{flex:1;display:flex;font:500 17px/1.55 "JetBrains Mono","DejaVu Sans Mono",ui-monospace,monospace;overflow:hidden;background:#1e1e1e}
#cw .gut{width:64px;text-align:right;padding:6px 14px 0 0;color:#6e7681;white-space:pre}
#cw .txt{padding:6px 0 0 8px;white-space:pre;color:#d4d4d4;flex:1;overflow:hidden}
#cw .sb{height:24px;background:#007acc;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:12px;color:#fff}
#cw .kw{color:#569cd6}#cw .st{color:#ce9178}#cw .cm{color:#6a9955}#cw .nu{color:#b5cea8}#cw .fn{color:#dcdcaa}#cw .ty{color:#4ec9b0}
#cw .term{height:230px;background:#1e1e1e;border-top:1px solid #333;font:500 14px/1.5 "DejaVu Sans Mono",monospace;padding:8px 16px;color:#ccc;overflow:hidden;white-space:pre}
#cw .term .ok{color:#3fb950}
/* ---------- phone ---------- */
#phone{position:absolute;inset:0;z-index:60;opacity:0;pointer-events:none;transition:opacity .8s;background:radial-gradient(900px 700px at 50% 45%,#1d2540,#080a12 75%)}
#phone.on{opacity:1}
#phone .stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:90px;align-items:center}
#phone .bezel{position:relative;width:520px;height:1100px;border-radius:70px;background:#05060a;border:2px solid #2a3140;box-shadow:0 40px 120px rgba(0,0,0,.8),inset 0 0 0 10px #0c0f18;padding:20px;transform:scale(.92)}
#phone .scr{position:relative;width:100%;height:100%;border-radius:52px;overflow:hidden;background:#0b0e14}
#phone .scr img{position:absolute;left:0;top:46px;width:100%;height:calc(100% - 46px);object-fit:fill;opacity:0;transition:opacity .45s}
#phone .scr img.on{opacity:1}
#phone .status{position:absolute;left:0;right:0;top:0;height:46px;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:0 34px;font-size:15px;font-weight:600;color:#fff}
#phone .cam{position:absolute;left:50%;top:14px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#000;z-index:6;box-shadow:0 0 0 2px #111}
#phone .launcher{position:absolute;inset:0;background:linear-gradient(170deg,#1b2a5a,#341a52 60%,#0f1426);transition:opacity .5s;z-index:3}
#phone .launcher.off{opacity:0;pointer-events:none}
#phone .grid{position:absolute;left:24px;right:24px;top:140px;display:grid;grid-template-columns:repeat(4,1fr);gap:34px 8px;text-align:center;font-size:12px;color:#fff}
#phone .grid .a{display:flex;flex-direction:column;align-items:center;gap:7px}
#phone .grid .a i{width:62px;height:62px;border-radius:19px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:30px}
#phone .grid .a img{width:62px;height:62px;border-radius:19px}
#phone .clock{position:absolute;top:410px;left:0;right:0;text-align:center;color:#fff;font:300 80px "Inter",sans-serif}
#phone .dockp{position:absolute;left:18px;right:18px;bottom:22px;height:92px;border-radius:34px;background:rgba(255,255,255,.14);display:flex;justify-content:space-around;align-items:center}
#phone .dockp i{width:62px;height:62px;border-radius:19px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:30px}
#phone .splash{position:absolute;inset:0;z-index:4;background:radial-gradient(400px 400px at 50% 45%,#2a2210,#0b0e14 75%);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .35s}
#phone .splash.on{opacity:1}#phone .splash img{width:150px;height:150px;position:static;opacity:1;border-radius:34px}
#phone .side{width:520px;font-family:Inter,system-ui,sans-serif}
#phone .side h3{margin:0 0 6px;font:600 52px/1.05 "Cormorant Garamond",Georgia,serif;letter-spacing:.14em;color:#fde68a}
#phone .side p{margin:0 0 22px;color:#94a3b8;font-size:20px}
#phone .side ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
#phone .side li{padding:12px 16px;border-radius:12px;border:1px solid rgba(212,160,23,.25);background:rgba(15,23,42,.6);font-size:21px;color:#e2e8f0;opacity:.45;transition:opacity .4s,border-color .4s}
#phone .side li.on{opacity:1;border-color:#fbbf24}
#phone .tap{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:rgba(255,255,255,.3);border:3px solid #fff;z-index:20;opacity:0;pointer-events:none}
#phone .tap.go{animation:tap .7s ease-out}
@keyframes tap{0%{transform:scale(.4);opacity:.95}100%{transform:scale(1.5);opacity:0}}
#phone .cap2{position:absolute;left:0;right:0;bottom:60px;text-align:center}
</style></head><body>
<div id="screen">
 <div id="wall"><svg width="560" height="560" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="#fde68a" stroke-width="2"/><path d="M50 14v36l24 14" fill="none" stroke="#fde68a" stroke-width="3"/><text x="50" y="94" font-size="9" text-anchor="middle" fill="#fde68a" font-family="serif">ΚΑΙΡΟΣ</text></svg></div>
 <div id="panel"><div class="l"><span>Activities</span><span class="app" id="appname">Kairos</span></div><div class="c" id="clock">Sat 4 Oct  20:41</div><div class="r"><span>🔊</span><span>📶</span><span>🔋 87%</span></div></div>
 <div id="icons">
  <div class="ico"><div class="g" style="background:#3b82f6">🏠</div>Home</div>
  <div class="ico"><div class="g" style="background:#475569">🗑</div>Trash</div>
  <div class="ico" id="ico-kairos"><img src="kairos.svg" alt=""><div style="margin-top:6px">Kairos</div></div>
 </div>
 <div id="dock"><div class="d" style="background:#3b82f6">📁</div><div class="d" style="background:#1f2937">⌨</div><div class="d" style="background:#ef4444">🌐</div><div class="d" id="d-code" style="background:#0e639c">⟨⟩</div><div class="d" id="d-kairos"><img src="kairos.svg" alt=""></div></div>

 <div class="win pre" id="kw"><div class="tb"><span>Kairos · Καιρός</span><div class="ctl"><i></i><i></i><i></i></div></div>
  <div class="splash" id="splash"><img src="kairos.svg" alt=""><b>KAIROS</b><div class="sp"></div></div>
  <iframe id="app" allow="microphone; camera; autoplay; display-capture; clipboard-write"></iframe></div>

 <div class="win pre" id="cw"><div class="tb"><div class="ctl"><i></i><i></i><i></i></div><span id="cw-title">Visual Studio Code</span></div>
  <div class="body"><div class="act"><span class="a1">▤</span><span>⌕</span><span>⑂</span><span>▷</span><span>⊞</span></div>
   <div class="side"><h6>EXPLORER</h6><div class="dir" id="cw-dir">▾ KAIROS-EXPORTS</div><div id="cw-files"></div></div>
   <div class="main"><div class="tabs"><div class="tab" id="cw-tab"></div></div><div class="crumbs" id="cw-crumbs"></div>
    <div class="code"><div class="gut" id="cw-gut"></div><div class="txt" id="cw-txt"></div></div><div class="term" id="cw-term"></div></div></div>
  <div class="sb"><span>⑂ main &nbsp; ⊗ 0 ⚠ 0</span><span id="cw-sb">Ln 1, Col 1 &nbsp;&nbsp; Spaces: 4 &nbsp;&nbsp; UTF-8 &nbsp;&nbsp; Python</span></div></div>

 <div id="phone"><div class="stage">
   <div class="bezel"><div class="scr">
     <div class="status"><span id="pclock">20:41</span><span>▂▄▆█ 5G &nbsp;🔋</span></div><div class="cam"></div>
     <div class="launcher" id="launcher"><div class="clock">20:41</div>
       <div class="grid" id="pgrid"></div><div class="dockp"><i style="background:#22c55e">📞</i><i style="background:#3b82f6">💬</i><i style="background:#ef4444">🌐</i><i style="background:#f59e0b">📷</i></div></div>
     <div class="splash" id="psplash"><img src="kairos.svg" alt=""></div>
     <img id="pimg" alt=""><img id="pimg2" alt="">
     <div class="tap" id="ptap"></div></div></div>
   <div class="side"><h3>KAIROS</h3><p>The native Android edition · Kotlin + Jetpack Compose</p><ul id="plist"></ul></div>
 </div></div>
</div>
<script>
const $=(s)=>document.querySelector(s), sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
const esc=(s)=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
setInterval(()=>{const d=new Date();$('#clock').textContent=d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})+'  '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})},1000);
// ---- phone launcher icons
$('#pgrid').innerHTML=[['📧','#ef4444','Mail'],['🗺','#22c55e','Maps'],['📅','#3b82f6','Calendar'],['🎵','#a855f7','Music'],['📷','#f59e0b','Camera'],['⚙','#64748b','Settings'],['🛍','#06b6d4','Store'],['KAIROS','','Kairos'],['📝','#eab308','Notes'],['☁','#0ea5e9','Weather'],['🧮','#475569','Calc'],['🎬','#f43f5e','Videos']]
 .map(([g,c,n])=>g==='KAIROS'?`<div class="a" id="p-kairos"><img src="kairos.svg" alt=""><span>${n}</span></div>`:`<div class="a"><i style="background:${c}">${g}</i><span>${n}</span></div>`).join('');
const desk=window.__desk={
  async selectIcon(){$('#ico-kairos').classList.add('sel');await sleep(250)},
  async launch(url){
    $('#ico-kairos').classList.add('sel'); $('#d-kairos').classList.add('bounce','run'); $('#appname').classList.add('on');
    const w=$('#kw'); w.classList.add('on'); w.classList.remove('pre'); await sleep(1200);
    $('#app').src=url; await new Promise(r=>{$('#app').onload=r; setTimeout(r,8000)}); await sleep(500);
    $('#splash').classList.add('off'); $('#app').classList.add('on'); await sleep(500);
  },
  async maximize(){$('#kw').classList.add('max');$('#dock').classList.add('hide');$('#ico-kairos').classList.remove('sel');await sleep(800)},
  async restoreApp(){$('#kw').classList.remove('max');$('#dock').classList.remove('hide');await sleep(800)},
  async hideApp(){$('#kw').classList.remove('on');$('#kw').classList.add('pre');await sleep(450)},
  async showApp(){$('#kw').classList.add('on');$('#kw').classList.remove('pre');await sleep(450)},
  async openEditor(spec){   // {dir, files:[{name}], name, content, language, terminal}
    $('#d-code').classList.add('bounce','run');$('#appname').textContent='Code';
    $('#cw-title').textContent=`${spec.name} — ${spec.dir} — Visual Studio Code`;
    $('#cw-dir').textContent='▾ '+spec.dir.toUpperCase();
    $('#cw-files').innerHTML=(spec.files||[]).map(f=>`<div class="f ${f===spec.name?'act2':''}">${f.endsWith('.py')?'🐍':f.endsWith('.html')?'◈':'▫'} ${esc(f)}</div>`).join('');
    $('#cw-tab').textContent=spec.name; $('#cw-crumbs').textContent=`${spec.dir} › ${spec.name}`;
    $('#cw-sb').innerHTML=`Ln 1, Col 1 &nbsp;&nbsp; Spaces: 4 &nbsp;&nbsp; UTF-8 &nbsp;&nbsp; ${spec.language||'Plain Text'}`;
    const lines=spec.content.replace(/\n$/,'').split('\n'); $('#cw-gut').textContent=lines.map((_,i)=>i+1).join('\n');
    const KW=/\b(def|return|if|else|elif|for|while|in|import|from|class|try|except|with|as|not|and|or|is|None|True|False|print|const|let|var|function|await|async|lambda|raise|yield|pass)\b/g;
    $('#cw-txt').innerHTML=lines.map(l=>{ // tokenise per line: comments, strings, keywords, numbers, calls
      let m=l.match(/^(.*?)(#.*|\/\/.*)$/); let code=m&&!/["']/.test(m[1].slice(-1))?m[1]:l, cm=m&&code===m[1]?m[2]:'';
      let h=esc(code).replace(/(&quot;|"[^"]*"|'[^']*')/g,'§$1§');
      h=h.replace(/("[^"]*"|'[^']*')/g,'<span class="st">$1</span>').replace(/§/g,'');
      h=h.replace(/(<span class="st">.*?<\/span>)|(\b\d+(\.\d+)?\b)|(\b(?:def|return|if|else|elif|for|while|in|import|from|class|try|except|with|as|not|and|or|is|None|True|False|const|let|var|function|await|async|lambda|raise|yield|pass)\b)|(\b[A-Za-z_]\w*(?=\())/g,(s,a,b,c,d,e)=>a?a:b?`<span class="nu">${b}</span>`:d?`<span class="kw">${d}</span>`:e?`<span class="fn">${e}</span>`:s);
      return h+(cm?`<span class="cm">${esc(cm)}</span>`:'');}).join('\n');
    $('#cw-term').innerHTML=spec.terminal?esc(spec.terminal):'';
    const w=$('#cw'); w.classList.add('on'); w.classList.remove('pre'); await sleep(900);
  },
  async closeEditor(){$('#cw').classList.remove('on');$('#cw').classList.add('pre');$('#d-code').classList.remove('run');$('#appname').textContent='Kairos';await sleep(500)},
  async termType(text,per=45){const t=$('#cw-term');t.textContent='';for(const ch of text){t.textContent+=ch;await sleep(per)}},
  // ---- phone
  phoneOn(){$('#phone').classList.add('on')}, phoneOff(){$('#phone').classList.remove('on')},
  phoneList(items,active){$('#plist').innerHTML=items.map((t,i)=>`<li class="${i===active?'on':''}">${t}</li>`).join('')},
  phoneStep(i){[...document.querySelectorAll('#plist li')].forEach((e,k)=>e.classList.toggle('on',k===i))},
  phoneTapRect(){const e=$('#p-kairos img').getBoundingClientRect();return {x:e.x+e.width/2,y:e.y+e.height/2}},
  async tapAt(x,y){const t=$('#ptap'),s=$('.scr').getBoundingClientRect();t.style.left=(x-s.x)+'px';t.style.top=(y-s.y)+'px';t.classList.remove('go');void t.offsetWidth;t.classList.add('go');await sleep(350)},
  async phoneLaunch(){await sleep(100);$('#psplash').classList.add('on');$('#launcher').classList.add('off');await sleep(1100)},
  phoneHome(){$('#launcher').classList.remove('off');$('#pimg').classList.remove('on');$('#pimg2').classList.remove('on');$('#psplash').classList.remove('on')},
  async phoneShow(src){ // cross-fade between two <img> layers
    const a=$('#pimg'),b=$('#pimg2'); const front=a.classList.contains('on')?a:b, back=front===a?b:a;
    await new Promise(r=>{back.onload=r;back.src=src});
    back.classList.add('on');front.classList.remove('on');$('#psplash').classList.remove('on');await sleep(60)},
  scrRect(){const r=$('.scr').getBoundingClientRect();return{x:r.x,y:r.y,w:r.width,h:r.height}},
  tapRect(sel){const e=$(sel).getBoundingClientRect();return{x:e.x+e.width/2,y:e.y+e.height/2}},
};
</script></body></html>
